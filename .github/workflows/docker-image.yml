name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@main

      - name: "Log in to GitHub Container Registry"
      
        #run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: "Build UserService image"
        run: docker build -t ghcr.io/lightningj0e/gameplatform-puvs/userserviceimage:latest -f ./Services/UserService/Dockerfile .

      - name: "Push Docker image_User"
        run: docker push ghcr.io/lightningj0e/gameplatform-puvs/userserviceimage:latest

      - name: "Build GameService image"
        run: docker build -t ghcr.io/lightningj0e/gameplatform-puvs/gameserviceimage:latest -f ./Services/GameService/Dockerfile .

      - name: "Push Docker image_Game"
        run: docker push ghcr.io/lightningj0e/gameplatform-puvs/gameserviceimage:latest

      - name: "Build Ranglisten image"
        run: docker build -t ghcr.io/lightningj0e/gameplatform-puvs/ranglistenserviceimage:latest -f ./Services/RanglisteService/Dockerfile .

      - name: "Push Docker image_Rangliste"
        run: docker push ghcr.io/lightningj0e/gameplatform-puvs/ranglistenserviceimage:latest
        
      - name: "Build Matchmaking image"
        run: docker build -t ghcr.io/lightningj0e/gameplatform-puvs/matchmakingserviceimage:latest -f ./Services/MatchmakingService/Dockerfile .

      - name: "Push Docker image_Matchmaking"
        run: docker push ghcr.io/lightningj0e/gameplatform-puvs/matchmakingserviceimage:latest

      - name: "Build Bot image"
        run: docker build -t ghcr.io/lightningj0e/gameplatform-puvs/botserviceimage:latest -f ./Services/BotService/Dockerfile .

      - name: "Push Docker image_Bot"
        run: docker push ghcr.io/lightningj0e/gameplatform-puvs/botserviceimage:latest

      - name: "Build Frontend image"
        run: docker build -t ghcr.io/lightningj0e/gameplatform-puvs/frontendservice:latest -f ./rps/Dockerfile .

      - name: "Push Docker image_Frontend"
        run: docker push ghcr.io/lightningj0e/gameplatform-puvs/frontendserviceimage:latest

