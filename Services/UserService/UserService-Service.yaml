apiVersion: v1
kind: Service
metadata:
  name: userservice
spec:
  type: NodePort
  selector:
    app: userservice
  ports:
    - protocol: TCP
      port: 8000        # Cluster-Port
      targetPort: 8000  # Container-Port
      nodePort: 30080   # Node-Port (z. B. 30080, muss im Bereich 30000-32767 liegen)
